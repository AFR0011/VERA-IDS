protocol:
  name: JISA CICIDS2017 exact-group-safe RF sensitivity
  split: B_group_safe
  unknown_family_setting: simulated_unknown_family

protocol_b_grid:
  legacy_overrides:
    audit_root: outputs/12_jisa_finalization/05_group_safe_support_audit
    audit_roots:
      - outputs/12_jisa_finalization/05_group_safe_support_audit
    manifest_glob: outputs/12_jisa_finalization/05_group_safe_support_audit/*/manifests/*.json
    base_helper_script: ids_eval_framework.src.two_stage_engine
    runs_root: outputs/12_jisa_finalization/06_group_safe_protocol_b_rf
    dry_run: false
    max_manifests: null
    reuse_preprocessor_if_present: true

    max_train_rows:
      CICIDS2017: 900000
    max_val_rows:
      CICIDS2017: 500000
    max_test_rows:
      CICIDS2017: null
    random_seed: 123
    n_jobs: 24

    # Two predeclared RF weighting lanes. These are not ranked against one another
    # for the primary matched-surface analysis. Historical per-holdout weighting
    # choices determine which new lane is used for the primary old-vs-new comparison.
    model_profiles:
      rf_inv_family_clipped:
        model_family: rf
        datasets:
          - CICIDS2017
        stage1_weight_modes:
          - inv_family_clipped
        stage2_weight_modes:
          - balanced
        stage1_param_grid:
          - n_estimators: 300
            max_depth: null
            min_samples_leaf: 1
            max_features: sqrt
        stage2_param_grid:
          - n_estimators: 300
            max_depth: null
            min_samples_leaf: 1
            max_features: sqrt
      rf_class_weight_balanced:
        model_family: rf
        datasets:
          - CICIDS2017
        stage1_weight_modes:
          - class_weight_balanced
        stage2_weight_modes:
          - balanced
        stage1_param_grid:
          - n_estimators: 300
            max_depth: null
            min_samples_leaf: 1
            max_features: sqrt
        stage2_param_grid:
          - n_estimators: 300
            max_depth: null
            min_samples_leaf: 1
            max_features: sqrt

    apply_loao_stage1_values:
      - true
    inv_family_clip_max: 20.0

    stage1_threshold_search:
      target_fpr_list:
        - 0.01
        - 0.02
      min_family_support_list:
        - 100
      objective_mode_list:
        - min_family_recall
        - p10_family_recall
      p10_quantile_list:
        - 0.10
      sweep_points: 40
      selection_tiebreak: objective_then_tpr

    tau_search:
      grid:
        - 0.3
        - 0.5
        - 0.7
      also_try_quantiles: false
      quantiles:
        - 0.10
      max_benign_family_fp_rate_list:
        - 0.02
      max_benign_reject_rate_list:
        - 0.10
      max_overall_reject_rate_list:
        - 0.03
      max_false_unknown_rate_all_known: 0.05
      max_false_unknown_rate_known_attacks: 0.10

protocol_b_summary:
  run_after_grid: true
  legacy_overrides:
    runs_root: outputs/12_jisa_finalization/06_group_safe_protocol_b_rf
    aggregate_csv: outputs/12_jisa_finalization/06_group_safe_protocol_b_rf/aggregate_results.csv
    out_dir: outputs/12_jisa_finalization/06_group_safe_protocol_b_rf/summary
    baseline_best_per_holdout_csv: outputs/summaries/protocol_b_best_per_holdout.csv
    # Keep fixed RF lanes separate. Do not select one weighting profile as the
    # primary winner after observing the new test results.
    best_per_holdout_group_cols:
      - dataset
      - holdout_family
      - model_profile
