experiment:
  name: JISA Phase 3A heldout-validation-blind Protocol-B score generation
  dataset: CICIoT2023
  seeds: [123, 124, 125, 126, 127]
  holdouts: [Botnet, BruteForce, DDoS, DoS, Other, Scan/Recon]
  output_root: outputs/13_jisa_q1_revision/phase3_validation_blind
  max_train_rows: 1500000
  max_val_rows: 700000
  max_test_rows: null
  n_jobs: 24
  xgb_device: cuda
  inv_family_clip_max: 20.0
  preprocessor_mode: historical_full_train_unsupervised_feature_exposure
  profile_selection: stage2_known_val_then_stage1_known_val_auc_then_lexical
  save_models: false
  save_preprocessor: true
  save_val_known_scores: true
  save_test_scores: true

stage1_threshold_search:
  target_fpr_list: [0.01, 0.02]
  min_family_support_list: [100]
  objective_mode_list: [min_family_recall, p10_family_recall]
  p10_quantile_list: [0.10]
  sweep_points: 40
  selection_tiebreak: objective_then_tpr

rejector_replay:
  primary_budget: 0.03
  budgets: [0.01, 0.03, 0.05, 0.10]
  max_benign_family_fp_rate: 0.02
  max_benign_reject_rate: 0.10
  max_false_unknown_rate_all_known: 0.05
  max_false_unknown_rate_known_attacks: 0.10
  selection_objective: max_feasible_validation_rejection
  tie_break: macro_f1_then_lower_false_unknown_then_deterministic_parameter
  methods: [max_confidence, margin, entropy, family_conditional]
  family_conditional_alpha_grid:
    start: 0.0
    stop: 0.10
    step: 0.005
