protocol:
  name: Protocol B support-audited LOAO
  split: B_day_file
  unknown_family_setting: simulated_unknown_family

support_audit_rules:
  require_unknown_in_val_when_tuning_tau: true
  min_benign_rows:
    val: 200
    test: 200
  min_family_support:
    train: 200
    val: 200
    test: 200
  unknown_support_for_holdout:
    val: 200
    test: 200
  min_known_families_after_holdout: 2
  require_all_remaining_train_families_to_be_valid: true

support_audit:
  legacy_overrides:
    processed_root: outputs/02_prepared_data/processed_V5_cicids17_recovery
    out_root: outputs/04_protocol_b_support_audit/protocolB_support_audit_out_cicids17_recovery
    datasets:
      - CICIDS2017

support_sensitivity:
  candidate_thresholds:
    - 50
    - 100
    - 200
    - 250
    - 500
  selected_threshold: 200
  confidence_level: 0.95
  min_known_families_after_holdout: 2
  benign_label: Benign
  support_tables:
    CICIoT2023: outputs/04_protocol_b_support_audit/protocolB_support_audit_out/CICIoT2023/family_support_by_split.csv
    CICIDS2017: outputs/04_protocol_b_support_audit/protocolB_support_audit_out_cicids17_recovery/CICIDS2017/family_support_by_split.csv
  out_root: outputs/04_protocol_b_support_audit/support_threshold_sensitivity

protocol_b_grid:
  legacy_overrides:
    audit_root: outputs/04_protocol_b_support_audit/protocolB_support_audit_out_cicids17_recovery
    manifest_glob: outputs/04_protocol_b_support_audit/protocolB_support_audit_out_cicids17_recovery/*/manifests/*.json
    base_helper_script: ids_eval_framework/src/two_stage_engine.py
    runs_root: outputs/05_protocol_b_loao/protocolB_grid_runs step 3 - CICIDS2017 sweep
    dry_run: false
    random_seed: 123
    n_jobs: 24
    apply_loao_stage1_values:
      - true

protocol_b_summary:
  run_after_grid: true
  legacy_overrides:
    aggregate_csv: outputs/05_protocol_b_loao/protocolB_grid_runs step 3 - CICIDS2017 sweep/aggregate_results.csv
    out_dir: outputs/05_protocol_b_loao/protocolB_grid_runs step 3 - CICIDS2017 sweep/summary

statistics:
  validation_selected_legacy_overrides:
    aggregate_csvs:
      - outputs/05_protocol_b_loao/protocolB_grid_runs step 2 stage-1 LOAO/aggregate_results.csv
      - outputs/05_protocol_b_loao/protocolB_grid_runs step 3 - CICIDS2017 sweep/aggregate_results.csv
    out_root: outputs/08_statistics/q2_validation_selected_protocol_b
    run_roots:
      CICIoT2023: outputs/05_protocol_b_loao/protocolB_grid_runs step 2 stage-1 LOAO
      CICIDS2017: outputs/05_protocol_b_loao/protocolB_grid_runs step 3 - CICIDS2017 sweep
  q2_statistics_legacy_overrides:
    source_root: outputs/06_open_set_rejection/protocolB_grid_runs step 5 - open-set baselines
    out_root: outputs/08_statistics/q2_statistical_refresh
    bootstrap_resamples: 1000
    random_seed: 123

reporting:
  build_competitive_pack: true
  build_core_pack: true
  build_finalization_pack: false
  skip_finalization_if_source_missing: true
  legacy_overrides:
    competitive_pack:
      runs_root: outputs/03b_protocol_a_flat_baseline/runs_competitive_metrics
      baseline_pack: outputs/supplementary/exploratory/thesis_full_scope_pack
      out_root: outputs/03b_protocol_a_flat_baseline/competitive_metrics_pack
    thesis_core_pack:
      protocol_a_summary_csv: outputs/03_protocol_a_two_stage/runs_two_stage_V5_A_core/summary/protocol_a_core_summary.csv
      validation_selected_protocol_b_csv: outputs/08_statistics/q2_validation_selected_protocol_b/validation_selected_protocol_b_results.csv
      validation_selected_sink_csv: outputs/08_statistics/q2_validation_selected_protocol_b/validation_selected_sink_summary.csv
      protocol_b_sources:
        - best_csv: outputs/05_protocol_b_loao/protocolB_grid_runs step 2 stage-1 LOAO/summary/best_per_holdout.csv
          protocol: B_day_file
          split_variant: day-file Protocol B baseline
        - best_csv: outputs/05_protocol_b_loao/protocolB_grid_runs step 3 - CICIDS2017 sweep/summary/best_per_holdout.csv
          protocol: B_day_file
          split_variant: recovered contiguous-within-day Protocol B variant
      step4_aggregate_csv: outputs/supplementary/exploratory/protocolB_grid_runs step 4 - targeted followups/aggregate_results.csv
      step4_runs_root: outputs/supplementary/exploratory/protocolB_grid_runs step 4 - targeted followups
      out_root: outputs/09_paper_pack/thesis_core_pack
    thesis_finalization_pack:
      thesis_pack: outputs/supplementary/exploratory/thesis_full_scope_pack
      step5_root: outputs/06_open_set_rejection/protocolB_grid_runs step 5 - open-set baselines
      step6_root: outputs/06b_sink_aware_rejection/protocolB_grid_runs step 6 - sink-aware rejection
      drift_action_root: outputs/supplementary/drift/drift_action_study
      processed_v5: outputs/02_prepared_data/processed_V5
      processed_cicids_recovery: outputs/02_prepared_data/processed_V5_cicids17_recovery
      support_audit_cicids_recovery: outputs/04_protocol_b_support_audit/protocolB_support_audit_out_cicids17_recovery
      out_root: outputs/09_paper_pack/thesis_finalization_pack
      source_manuscript: manuscript/thesis-source.md
      manuscript_dir: manuscript
